services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aventureiros_db
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root
      DB_NAME: aventureiros_db
      JWT_SECRET: change_this_secret
      PORT: 5000
      SEED_ADMIN_EMAIL: admin@aventureiros.com
      SEED_ADMIN_PASSWORD: 123456
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5000:5000"
    command: npm run dev
    depends_on:
      - db
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000/api
      CHOKIDAR_USEPOLLING: "true" 
    ports:
      - "5173:5173"
    command: npm run dev 
    depends_on:
      - backend

volumes:
  mysql_data:
